spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /mazebank

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mongo:
  connection:
    url: ${MONGO_CONNECTION_URL:mongodb://127.0.0.1:27017}

ldap:
  urls: ${LDAP_URL:ldap://127.0.0.1:389}
  base: ${LDAP_BASE:dc=example,dc=com}
  username: ${LDAP_USER_DN:cn=administrator}
  password: ${LDAP_PASSWORD:2FederateM0re}
