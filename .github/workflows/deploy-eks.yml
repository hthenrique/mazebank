name: Deploy Docker to EKS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release para deploy ou rollback, ex: v1.0.4"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

env:
  JAVA_VERSION: "17"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: mazebank

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          POM_VERSION=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          DEFAULT_IMAGE_TAG="v${POM_VERSION}"
          INPUT_TAG="${{ github.event.inputs.release_tag }}"

          if [[ -n "${INPUT_TAG}" ]]; then
            IMAGE_TAG="${INPUT_TAG}"
          else
            IMAGE_TAG="${DEFAULT_IMAGE_TAG}"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && -z "${INPUT_TAG}" && "${GITHUB_REF_NAME}" != "${DEFAULT_IMAGE_TAG}" ]]; then
            echo "Git tag (${GITHUB_REF_NAME}) and pom version (${DEFAULT_IMAGE_TAG}) are out of sync."
            exit 1
          fi

          echo "pom_version=${POM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "default_image_tag=${DEFAULT_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and verify
        run: ./mvnw -B clean verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image tag already exists
        id: image-check
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        shell: bash
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        id: build-image
        if: steps.image-check.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Reuse existing Docker image
        id: existing-image
        if: steps.image-check.outputs.exists == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Install kubectl and Helm
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy Helm Chart
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image || steps.existing-image.outputs.image }}
          MONGO_CONNECTION_URL: ${{ secrets.MONGO_CONNECTION_URL }}
        run: |
          # Extrai imagem (repositório e tag)
          REPO=$(echo "$IMAGE_URI" | cut -d':' -f1)
          TAG=$(echo "$IMAGE_URI" | cut -d':' -f2)

          helm upgrade --install mazebank ./helm/mazebank \
            --namespace $K8S_NAMESPACE --create-namespace \
            --set image.repository="$REPO" \
            --set image.tag="$TAG" \
            --set secret.create=true \
            --set secret.mongoConnectionUrl="$MONGO_CONNECTION_URL"

      - name: Wait for rollout
        run: kubectl -n $K8S_NAMESPACE rollout status deployment/mazebank --timeout=180s

      - name: Collect Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n $K8S_NAMESPACE || true
          kubectl get events -n $K8S_NAMESPACE --sort-by=.metadata.creationTimestamp || true
          kubectl describe deployment mazebank -n $K8S_NAMESPACE || true
          kubectl describe pods -n $K8S_NAMESPACE || true
          kubectl logs -n $K8S_NAMESPACE deployment/mazebank --all-containers=true || true
